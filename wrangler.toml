# ============================================================================
# Cloudflare Workers — backend da barbearia
#
# Um arquivo por cliente? Não: o MESMO código serve todos. O que muda é o
# banco (database_id) e as variáveis. Duplique só o bloco [env.<cliente>].
#
#   npx wrangler d1 create barbearia-<cliente>
#   npx wrangler d1 execute barbearia-<cliente> --remote --file=banco-d1/01-schema.sql
#   npx wrangler deploy --env <cliente>
# ============================================================================

name = "barbearia-backend"
main = "src/worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "enable_nodejs_http_server_modules"]

# Tarefas agendadas — os mesmos horários que eram node-cron.
# O worker.js despacha cada expressão para a função certa em src/jobs.js.
# O iconv-lite (via Express → body-parser) não carrega no workerd.
# A API é UTF-8 pura, então trocamos por um stub.
[alias]
"iconv-lite" = "./src/shims/iconv-lite.js"

[triggers]
crons = ["0 11 * * *", "0 6 * * *", "*/5 * * * *"]
# 11:00 UTC = 08:00 em Brasília (lembretes do dia seguinte)
#  6:00 UTC = 03:00 em Brasília (expiração de pontos)
#  a cada 5 min: lembretes por push

# ---------------------------------------------------------------------------
# Instância-mestre
#
# ⚠️  ANTES DE SUBIR PARA O GITHUB, troque o database_id abaixo pelo ID de
#     verdade do seu banco. Onde achar: dash.cloudflare.com → Storage &
#     Databases → D1 SQL Database → clique em `barbearia-mestre` → copie o
#     campo "Database ID" (é um código com traços, tipo
#     a1b2c3d4-5e6f-7890-abcd-ef1234567890).
#
#     Sem isso o deploy para com:
#       binding DB of type d1 must have a valid `database_id` specified [10021]
#
#     O binding do banco vem DAQUI, não do painel: o `wrangler deploy` usa este
#     arquivo como verdade e sobrescreve o que estiver configurado na tela.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "barbearia-mestre"
database_id = "9bf79a83-7ce1-46fd-87fc-2e7037caf4f5"

[vars]
APP_NOME = "Barbearia Vértice"
APP_NOME_CURTO = "Vértice"
APP_CIDADE = "Canoas"
APP_UF = "RS"
APP_SITE = "barbeariavertice.com.br"
APP_PREFIXO = "appvertice"
NODE_ENV = "production"
TZ_APP = "America/Sao_Paulo"

# Segredos NÃO vão aqui. Use:
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put WEBHOOK_TOKEN
#   npx wrangler secret put VAPID_PUBLIC
#   npx wrangler secret put VAPID_PRIVATE
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put EVOLUTION_API_KEY

# ---------------------------------------------------------------------------
# Cliente novo: copie este bloco, troque o nome e o database_id
